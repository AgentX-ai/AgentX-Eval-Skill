# skillevaluator policy overlay - layered on top of the shipped `external` profile,
# so LICENSE.* stays critical and the schema author rules stay high. This file only
# moves the findings below off the blocking path.
#
#   skillevaluator validate ./plugins/agentx --type plugin --policy skillevaluator-policy.yaml
#
# Each entry is an accepted risk, not a fix. What is NOT here matters as much: the
# five findings this repo actually fixed - a `.env` grep that printed the project key
# into the transcript, an inaccurate docstring, a comment in an over-commented example,
# a curl piped into an interpreter, and bytecode the test suite left inside the plugin -
# were changed in the source rather than written down here.
#
# tests/test_policy_keys.py holds every key below against a live scan. SkillSpector
# embeds line numbers in its taint-flow keys, so an edit above line 77 of pick_eval.py
# silently stops the suppression matching. That test turns "silently" into a red build.

profile: agentx-plugin

severity_overrides:
  # Two sites remain, both naming `.env` rather than reading a secret: a SKIP_DIRS entry
  # in detect_stack.py (a directory the walker refuses to descend into) and the section
  # of eval-brief.md whose subject IS a stale `.env` host. Removing either would delete
  # working behaviour or the documentation of a real hazard.
  "SECURITY.Credential Access (PE3)": medium

  # The project API key is read from the environment and sent as `x-api-key` to the
  # engine it authenticates against. That is what an API client is. The rule asks for
  # credentials never to reach a network sink, which no authenticated client can satisfy.
  "SECURITY.Tainted flow: 'req' from os.environ.get (line 77, credential/environment) → urllib.request.urlopen (network output) (TT3)": medium

  # The project API key is read from the environment and sent as `x-api-key` to the
  # engine it authenticates against. That is what an API client is. The rule asks for
  # credentials never to reach a network sink, which no authenticated client can satisfy.
  "SECURITY.Tainted flow: 'req' from os.environ.get (line 81, credential/environment) → urllib.request.urlopen (network output) (TT3)": medium
