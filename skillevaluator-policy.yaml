# skillevaluator policy overlay - layered on top of the shipped `external` profile,
# so LICENSE.* stays critical and the schema author rules stay high. This file only
# moves the findings below off the blocking path.
#
#   skillevaluator validate ./plugins/agentx --type plugin --policy skillevaluator-policy.yaml
#
# Each entry is an accepted risk, not a fix. What is NOT here matters as much: the
# five findings this repo actually fixed - a `.env` grep that printed the project key
# into the transcript, an inaccurate docstring, a comment in an over-commented example,
# a curl piped into an interpreter, and bytecode the test suite left inside the plugin -
# were changed in the source rather than written down here.
#
# tests/test_policy_keys.py holds every key below against a live scan. SkillSpector
# embeds line numbers in its taint-flow keys, so an edit above line 77 of pick_eval.py
# silently stops the suppression matching. That test turns "silently" into a red build.
#
# It also holds `accepted_sites` below. A severity override is keyed by RULE, not by
# file, so downgrading PE3 downgrades it everywhere - including in files added later
# that nobody reviewed. That is a property of the mechanism, not an observed failure:
# an attempt to demonstrate it was inconclusive, because SkillSpector did not flag the
# planted file at all (it reported a per-file `runtime_limit` on it). Which is its own
# reason to bound the acceptance rather than trust the scanner's reach. skillevaluator
# ignores this key; tests/test_policy_keys.py does not.

profile: agentx-plugin

severity_overrides:
  # (Three earlier entries - Credential Access PE3 and the pick_eval/make_dataset taint
  # flows - were deleted when the scanner stopped reporting them: tests/test_policy_keys.py
  # flags stale entries, and an overlay must describe the repo as scanned today.)

  # Same shape, same reasoning, in auto-improve's report fetcher: the key rides x-api-key to
  # the engine that minted it, and checked_url() has already refused any non-http(s) scheme
  # before the request exists.
  "SECURITY.Tainted flow: 'req' from os.environ.get (line 62, credential/environment) → urllib.request.urlopen (network output) (TT3)": medium

# Every file each accepted rule is allowed to appear in. A finding of that rule anywhere
# else is a new risk wearing an old rule's name, and fails tests/test_policy_keys.py.
accepted_sites:
  "SECURITY.Tainted flow: 'req' from os.environ.get (line 62, credential/environment) → urllib.request.urlopen (network output) (TT3)":
    - skills/auto-improve/scripts/fetch_report.py
