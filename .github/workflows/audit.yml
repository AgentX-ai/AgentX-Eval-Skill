# The skills are prose a model executes literally, so a stale flag or a renamed SDK symbol is
# not a typo - it is a command that fails in front of a user in the first seconds of the skill.
# tests/audit_skills.py holds the documentation against the code it tells an agent to run.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  # The SDK moves on its own schedule. A weekly run turns the repo red when agentx-python
  # renames something the briefs name, without waiting for someone to happen to commit.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  structure:
    # No SDK, no network: does the repo agree with itself, on the oldest Python the README
    # promises and on the newest one anybody runs?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/audit_skills.py --skip-sdk
      - run: python3 tests/test_runeval_scripts.py
      - run: python3 tests/test_live_link.py   # SKIPs where no engine is reachable
      # Same deal: the SDK grew a unified judge-scorer surface the engine does not serve
      # yet, so this holds the picker's endpoint against whatever engine is reachable.
      - run: python3 tests/test_live_grader_surface.py
      # The audit is a smoke detector; this proves the detector itself, by breaking a copy
      # of the repo 20 ways (29 with the SDK) and requiring each break to be caught by name.
      - run: python3 tests/test_audit_fires.py
      # SKIPs where skillevaluator is absent, which is here. The validate job below is
      # where it actually runs.
      - run: python3 tests/test_policy_keys.py

  sdk:
    # Does the repo still agree with the package the skills generate code against?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "agentx-python[langchain]"
      - run: python3 tests/audit_skills.py
      - run: python3 tests/test_audit_fires.py

  validate:
    # The NVIDIA SkillEvaluator gate. skillevaluator-policy.yaml moves three findings off
    # the blocking path; test_policy_keys.py is what stops that overlay from quietly
    # covering more than it says. Without the three external scanners the security tier
    # fails on tooling rather than on this repo, so all three are installed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # uv drops tool binaries in ~/.local/bin, which is not on the runner's PATH by
      # default - without this every skillevaluator step below is a command-not-found.
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv tool install --python 3.13 "skillevaluator[all] @ git+https://github.com/NVIDIA/SkillEvaluator.git"
      # --with setuptools: semgrep imports pkg_resources, which is absent on 3.12+ without
      # it. Lacking it, Code Risk Analysis fails as "Semgrep did not return valid JSON" -
      # a tooling failure that reads exactly like a repo failure.
      - run: uv tool install --with setuptools semgrep
      - run: uv tool install --python 3.13 "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git"
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - run: skillevaluator validate ./plugins/agentx --type plugin --no-dedup --policy skillevaluator-policy.yaml
      - run: |
          for s in eval-fix instrument run-eval; do
            skillevaluator validate "./plugins/agentx/skills/$s" --no-dedup --policy skillevaluator-policy.yaml
          done
      - run: python3 tests/test_policy_keys.py

  dedup:
    # Tier 2 needs an embeddings/LLM provider, so it runs only where a key exists. It
    # skips rather than fails without one: a fork without the secret should not go red on
    # something it cannot run. Tier 3 (live agent eval) is deliberately not here - it wants
    # Docker and ~10 minutes per skill, and it is advisory by design.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv tool install --python 3.13 "skillevaluator[all] @ git+https://github.com/NVIDIA/SkillEvaluator.git"
      - name: Tier 2 deduplication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "no OPENAI_API_KEY secret - skipping Tier 2 (set one to enable)"
            exit 0
          fi
          for s in eval-fix instrument run-eval; do
            skillevaluator validate "./plugins/agentx/skills/$s" \
              --policy skillevaluator-policy.yaml
          done
